<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiveBox — Niamh, Customer Care</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&display=swap');

:root {
  --honey:#C97F1F; --honey-light:#F5E2B3; --honey-pale:#FDF6E3;
  --comb:#E8C87A; --ink:#2B1D0E; --muted:#7A6145;
  --surface:#FFFCF4; --bdr:rgba(43,29,14,0.11);
  --user-bg:#2B1D0E; --bot-bg:#FFF8EC; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--honey-pale);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;background-image:radial-gradient(circle at 20% 80%,rgba(201,127,31,.08) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(232,200,122,.10) 0%,transparent 50%);}
.shell{width:100%;max-width:520px;display:flex;flex-direction:column;height:min(680px,90vh);background:var(--surface);border-radius:20px;box-shadow:0 6px 30px rgba(43,29,14,.12);overflow:hidden;border:1px solid var(--bdr);}
.hdr{padding:14px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--bdr);flex-shrink:0;background:var(--surface);}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,var(--comb),var(--honey));display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.hdr-info h1{font-family:'DM Serif Display',serif;font-size:15px;color:var(--ink);font-weight:400;}
.hdr-info p{font-size:11.5px;color:var(--muted);margin-top:1px;}
.live{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.dot{width:7px;height:7px;border-radius:50%;background:#52b34c;animation:pulse 2s ease infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}

/* chat */
.chat-body{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;}
.msgs::-webkit-scrollbar{width:3px;}
.msgs::-webkit-scrollbar-thumb{background:var(--honey-light);border-radius:3px;}
.mrow{display:flex;align-items:flex-end;gap:7px;}
.mrow.user{flex-direction:row-reverse;}
.mav{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;}
.bot .mav{background:linear-gradient(145deg,var(--comb),var(--honey));}
.user .mav{background:var(--user-bg);color:#fff;font-size:9px;font-weight:500;}
.bbl{max-width:74%;padding:10px 13px;border-radius:var(--r);font-size:13.5px;line-height:1.5;white-space:pre-wrap;}
.bot .bbl{background:var(--bot-bg);color:var(--ink);border-bottom-left-radius:3px;border:1px solid var(--bdr);}
.user .bbl{background:var(--user-bg);color:#fff;border-bottom-right-radius:3px;}
.typing-bbl{background:var(--bot-bg);border:1px solid var(--bdr);border-radius:var(--r);border-bottom-left-radius:3px;padding:11px 14px;display:flex;gap:4px;align-items:center;}
.typing-bbl span{width:6px;height:6px;border-radius:50%;background:var(--honey);animation:bnc 1.2s ease infinite;}
.typing-bbl span:nth-child(2){animation-delay:.15s;}
.typing-bbl span:nth-child(3){animation-delay:.30s;}
@keyframes bnc{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}
.qr{display:flex;flex-wrap:wrap;gap:7px;padding:0 16px 10px;flex-shrink:0;}
.qbtn{border:1px solid var(--honey);background:transparent;color:var(--honey);padding:6px 12px;border-radius:18px;font-size:12.5px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .14s;}
.qbtn:hover{background:var(--honey);color:#fff;}
.inp-area{border-top:1px solid var(--bdr);padding:10px 14px;display:flex;gap:9px;align-items:flex-end;background:var(--surface);flex-shrink:0;}
.inp-wrap{flex:1;background:var(--honey-pale);border:1px solid var(--bdr);border-radius:12px;display:flex;align-items:flex-end;padding:7px 11px;transition:border-color .15s;}
.inp-wrap:focus-within{border-color:var(--honey);}
#userInput{flex:1;border:none;background:transparent;font-size:13.5px;font-family:'DM Sans',sans-serif;color:var(--ink);resize:none;outline:none;max-height:90px;line-height:1.5;}
#userInput::placeholder{color:var(--muted);}
#sendBtn{width:38px;height:38px;border-radius:50%;border:none;background:var(--honey);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .14s,transform .1s;font-size:14px;}
#sendBtn:hover{background:var(--ink);}
#sendBtn:active{transform:scale(.93);}
#sendBtn:disabled{background:var(--honey-light);cursor:default;}
footer{text-align:center;font-size:10.5px;color:var(--muted);padding:5px 0 8px;flex-shrink:0;background:var(--surface);}
</style>
</head>
<body>
<div class="shell">
  <div class="hdr">
    <div class="av">🐝</div>
    <div class="hdr-info">
      <h1>Niamh Buckley</h1>
      <p>AI Customer Care · HiveBox Apiary Co.</p>
    </div>
    <div class="live"><div class="dot"></div>Gemini</div>
  </div>

  <!-- Chat UI -->
  <div class="chat-body" id="chatBody">
    <div class="msgs" id="msgs"></div>
    <div class="qr" id="qr"></div>
    <div class="inp-area">
      <div class="inp-wrap">
        <textarea id="userInput" rows="1" placeholder="Describe what happened when you opened the box..."></textarea>
      </div>
      <button id="sendBtn" aria-label="Send">&#9658;</button>
    </div>
    <footer>Powered by Gemini 3.5 Flash Lite · AI colleague · Live Arrival Guarantee applies</footer>
  </div>
</div>

<script>
const WORKER_URL = 'https://hivebox-api.hiveboxapiary.workers.dev';

const SYSTEM = `You are Niamh Buckley, the AI customer care colleague for HiveBox Apiary Co., a mail-order live queen bee business. You are an AI, not a human, and say so plainly if asked.

HiveBox ships mated queen bees overnight. Your core job: resolve the problem causing 80% of support contacts — queens arriving dead, weak/cold, or "balled" (attacked by stressed attendant bees) due to temperature swings during transit.

HiveBox Live Arrival Guarantee: any customer whose queen arrives dead or non-viable gets a free replacement shipped same-day, OR a full refund. No questions asked.

Triage rules:
- TRIAGE FIRST. Never jump to a resolution before knowing what happened. Dead, cold-but-recoverable, and balled queens each need a different response.
- Ask one focused question at a time. The most important opening question: "When you opened the package, what did you find?"
- Cold or motionless does not always mean dead. Ask: is she stiff or limp/cold? If limp: room temp 22-25C, tiny drop of honey or sugar water on the screen, recheck in 1-3 hours. Often recovers.
- Balling: attendants stressed and attacked queen. Check if she is still moving inside the cluster. Covered by guarantee either way.
- New queens must be introduced via candy-release cage method over 3-5 days. Releasing directly is the second most common cause of queen loss after transit mortality.
- Orders tracked at hivebox.example/track with order number format HB-XXXXX.
- ThermoCage insulated packaging cuts transit mortality significantly.

Tone: warm, direct, fast. One idea per paragraph. No preamble. No em dashes. End when the resolution is clear. If something exceeds your scope, offer to connect to a human Care Specialist.`;

let history = []; // [{role:'user'|'model', parts:[{text:'...'}]}]

// --- Start chat on load ---
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    addMsg("When you opened the package, what did you find?", 'bot');
    setQR(["My queen arrived dead", "Queen looks cold or weak", "She's been balled by her bees", "Track my order", "How do I introduce her?"]);
    document.getElementById('userInput').focus();
  }, 300);
});

// --- Chat helpers ---
const msgsEl = document.getElementById('msgs');
const qrEl   = document.getElementById('qr');
const uiEl   = document.getElementById('userInput');
const sbEl   = document.getElementById('sendBtn');

function addMsg(text, role) {
  const row = document.createElement('div');
  row.className = 'mrow ' + role;
  const av = document.createElement('div');
  av.className = 'mav';
  av.textContent = role === 'bot' ? '🐝' : 'YOU';
  const bbl = document.createElement('div');
  bbl.className = 'bbl';
  bbl.textContent = text;
  row.appendChild(av); row.appendChild(bbl);
  msgsEl.appendChild(row);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'mrow bot'; row.id = 'tyRow';
  const av = document.createElement('div');
  av.className = 'mav'; av.textContent = '🐝';
  const b = document.createElement('div');
  b.className = 'typing-bbl';
  b.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(av); row.appendChild(b);
  msgsEl.appendChild(row);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}
function removeTyping() { const t = document.getElementById('tyRow'); if(t) t.remove(); }

function setQR(labels) {
  qrEl.innerHTML = '';
  labels.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'qbtn'; btn.textContent = l;
    btn.onclick = () => send(l);
    qrEl.appendChild(btn);
  });
}

// --- Cloudflare Worker API call ---
async function callGemini(userText) {
  history.push({ role: 'user', parts: [{ text: userText }] });

  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: history,
      system_instruction: { parts: [{ text: SYSTEM }] }
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${res.status}`);
  }

  const data = await res.json();
  const reply = data.reply;
  if (!reply) throw new Error('Empty response from worker');

  history.push({ role: 'model', parts: [{ text: reply }] });
  return reply;
}

// --- Send ---
async function send(text) {
  if (!text.trim() || sbEl.disabled) return;
  setQR([]);
  addMsg(text, 'user');
  uiEl.value = ''; uiEl.style.height = 'auto';
  sbEl.disabled = true;
  showTyping();

  try {
    const reply = await callGemini(text);
    removeTyping();
    addMsg(reply, 'bot');

    // Contextual quick replies
    const low = reply.toLowerCase();
    let sug = [];
    if (low.includes('dead') || low.includes('guarantee') || low.includes('replacement') || low.includes('refund')) {
      sug = ['Send me a replacement', 'I prefer a refund', 'Talk to a human'];
    } else if (low.includes('cold') || low.includes('weak') || low.includes('slug') || low.includes('recover')) {
      sug = ['She recovered, thanks', 'Still not moving', 'What temperature?'];
    } else if (low.includes('ball') || low.includes('cluster') || low.includes('attend')) {
      sug = ["She didn't make it", "She's still alive", 'Talk to a human'];
    } else if (low.includes('introduc') || low.includes('candy') || low.includes('cage')) {
      sug = ['Queen arrived dead', 'Track my order', 'Talk to a human'];
    } else {
      sug = ['Queen arrived dead', 'Queen looks weak', 'Track my order'];
    }
    setQR(sug);

  } catch(e) {
    removeTyping();
    addMsg(`Sorry, something went wrong: ${e.message}.`, 'bot');
    console.error(e);
  }

  sbEl.disabled = false;
  uiEl.focus();
}

uiEl.addEventListener('input', () => {
  uiEl.style.height = 'auto';
  uiEl.style.height = Math.min(uiEl.scrollHeight, 90) + 'px';
});
uiEl.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(uiEl.value.trim()); }
});
sbEl.addEventListener('click', () => send(uiEl.value.trim()));
</script>
</body>
</html>
